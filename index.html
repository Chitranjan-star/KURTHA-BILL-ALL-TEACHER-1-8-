<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#111;--mut:#666;--bd:#d9d6cf;--ln:#000;--card:#f3f1ec;--ac:#1f4e9c;--acf:#fff;--bad:#b3261e;--hl:#fff7d6;--yl:#ffff00;--yf:#0000ff;--gr:#d9d9d9;--lb:#d9e2f3;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 "Times New Roman",Times,serif}
button,select,input{font-family:"Times New Roman",Times,serif}
header{padding:16px 12px 4px;text-align:center}
h1{font-size:22px;margin:0;color:#14305f;letter-spacing:.2px}
.sub{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.chip{background:#eaf0fb;color:#1f3d7a;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.card{width:calc(100% - 16px);max-width:1180px;margin:12px auto;border:1px solid #dfe5f0;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(16,24,40,.07)}
.card>h2,.card>summary{font-size:15px;font-weight:700;color:#14305f;margin:0;padding:13px 16px;cursor:pointer;list-style:none}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"▾";float:right;color:#667085}.card[open]>summary::after{content:"▴"}
.card>h2{cursor:default}
.card .body{padding:2px 16px 16px}
.sec{margin-top:14px}.sec:first-child{margin-top:4px}
.sec h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:#667085;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid #eef1f6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .w{grid-column:span 2}
@media(min-width:760px){.fg{grid-template-columns:repeat(4,1fr)}}
.f{display:flex;flex-direction:column;min-width:0}.f label{font-size:12px;font-weight:600;color:#475467;margin-bottom:4px}
.f .r{display:flex;gap:6px}.f select,.f input{width:100%}
.f .r select,.f .r input{flex:1 1 0;width:auto;min-width:0}
select,input,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px;min-width:0}
.card select,.card input,.card button{min-height:40px;border:1px solid #cfd6e4;border-radius:8px;padding:8px 10px;font-size:14px}
.card select:focus,.card input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(31,78,156,.22)}
.card button{flex:none;white-space:nowrap;min-width:max-content;padding:8px 16px;background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;cursor:pointer}
.card button.g{background:#fff;color:#14305f;border-color:#cfd6e4}
.card button:active{transform:translateY(1px)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.cnt{font-size:13px;font-weight:600;color:#1f3d7a}
.hint{font-size:12px;color:#667085;margin-top:4px}
.wrap{overflow-x:auto;padding:0 8px 14px}
.sheet{border-collapse:collapse;table-layout:fixed;font-family:"Times New Roman",Times,serif;font-size:12px;margin:0 auto}
.sheet td,.sheet th{border:1px solid var(--ln);padding:2px 3px;text-align:center;overflow:hidden;text-overflow:clip;white-space:nowrap;font-weight:400}
.sheet th{font-size:11px}
.sheet td.l{text-align:left}.sheet .b{font-weight:700}.sheet .h{font-size:13px;font-weight:700}
.sheet td.nm{position:sticky;left:0;background:var(--bg);z-index:1}
.sheet tr.pk td{background:var(--hl)}.sheet tr.tot td{font-weight:700}
.sheet .gy{background:var(--gr);font-weight:700}.sheet .lb{background:var(--lb);font-weight:700}
.sheet .nv{background:var(--ac);color:var(--acf);font-weight:700;font-size:16px}
.sheet .yl{background:var(--yl);color:var(--yf);font-weight:700}
.sheet td.nb{border:0;text-align:left}
.sheet td.ct{text-align:center}.sheet td.pr{white-space:nowrap}
.sheet tbody td{padding-top:calc(2px + var(--rh,0px));padding-bottom:calc(2px + var(--rh,0px))}
.sheet td.tx{text-align:left;white-space:normal}
.sheet input{width:100%;text-align:center;padding:1px;border-radius:0;border:1px solid var(--bd);font-family:inherit;font-size:12px}
.sheet select{padding:1px;font-family:inherit;font-size:12px;max-width:100%}
.neg{color:var(--bad);font-weight:700}
.note{width:calc(100% - 16px);max-width:1180px;margin:8px auto;padding:9px 12px;background:#f5f8ff;border:1px solid #dfe8fb;border-radius:8px;color:#475467;font-size:12.5px;text-align:center}
.rhl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#14305f}.rhl select{min-height:40px}
.po{display:none}.sheet .bsel{width:100%;font-size:12px;padding:1px;min-width:0}.card textarea{width:100%;font:inherit;font-size:13px;border:1px solid #cfd6e4;border-radius:8px;padding:8px}
.lk{background:none;border:0;color:#0563c1;text-decoration:underline;padding:0;cursor:pointer;font-weight:400}

.wrap{text-align:center}.sheet{margin:0 auto}
@page{size:A4 landscape;margin:8mm}
@media print{.card,header,.note{display:none}.np{display:none!important}
:root:root:root{--bg:#fff;--fg:#000;--ln:#000;--hl:#fff;--bad:#000;--gr:#fff}
html,body{overflow:visible!important;max-width:none}body{background:#fff;color:#000}.wrap{overflow:visible;padding:0}.sheet{width:100%!important;table-layout:fixed;font-size:11px}col{width:var(--p)!important}
.sheet td.nm{position:static}.sheet tr{page-break-inside:avoid}.sheet tr.pk td{background:none}
.sheet input{border:0;background:none;padding:0;color:#000;-webkit-appearance:none;appearance:none;-moz-appearance:textfield}
.sheet input::-webkit-inner-spin-button{display:none}
.sheet td,.sheet th{overflow:visible!important;text-overflow:clip!important;white-space:normal!important;word-break:break-word;overflow-wrap:anywhere;font-size:10px;padding-left:2px;padding-right:2px;line-height:1.25}
.sheet td.pr{white-space:nowrap!important;overflow-wrap:normal!important;word-break:keep-all!important}
.sheet td.h{font-size:12px}.sheet thead{display:table-header-group}
.sheet{width:calc(100% - 2px)!important;border-collapse:separate!important;border-spacing:0!important;border-top:1.4pt solid #000!important;border-left:1.4pt solid #000!important}
.sheet td,.sheet th{border:0!important;border-right:1.4pt solid #000!important;border-bottom:1.4pt solid #000!important}
.sheet td.nb{border-right:0!important;border-bottom:0!important}
.po{display:inline!important}.sheet td.nm{position:static!important;z-index:auto!important;background:transparent!important}.sheet td.ic,.sheet .ic{display:none!important}.sheet td.nm{overflow:visible}}
.sheet tr.hl1 td{background:#fff2a8}.sheet tr.hl2 td{background:#c6efce}.sheet tr.hl3 td{background:#bdd7ee}.sheet tr.hl4 td{background:#f8cbd6}
.sheet tr[class*=hl] td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet select[data-hi]{width:76px;font-size:11px;padding:1px}
.sheet td.nm{position:sticky}.sheet .ic{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;gap:3px;background:rgba(255,255,255,.92);padding:1px}
.sheet .cb{background:#fff;border:1px solid #cfd6e4;border-radius:4px;padding:0 4px;font-size:13px;line-height:1.3;cursor:pointer;min-width:0}
.sheet .del{background:#fff;color:#b3261e;border:1px solid #e3b4b0;border-radius:4px;padding:0 5px;font-size:13px;line-height:1.3;cursor:pointer;min-width:0}
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 8px 4px}
.seg button{min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid #cfd6e4;background:#fff;color:#14305f;font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.saved{font-size:12.5px;color:#067647;font-weight:600}.saved.bad{color:#b3261e}
.card button:disabled{opacity:.45;cursor:default}
.abar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ov{position:fixed;inset:0;background:rgba(16,24,40,.55);display:flex;overflow:auto;padding:12px 4px;z-index:50}
.ov[hidden]{display:none}
.card button.ssb{display:block;position:relative;width:100%;min-width:0;text-align:left;background:#fff;color:var(--fg);font-weight:400;padding:8px 28px 8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-color:#cfd6e4}
.ssb::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#475467}
.sp{margin:0 auto auto!important;max-width:560px}
.sph{display:flex;gap:8px;padding:12px 12px 8px}.sph input{flex:1}
#splist{max-height:52vh;overflow-y:auto;border-top:1px solid #eef1f6}
.spi{padding:12px 14px;border-bottom:1px solid #eef1f6;font-size:15px;cursor:pointer}.spi:active{background:#eef3fd}
.spi.on{background:#e6eefc;font-weight:700;color:#14305f}
.spc{padding:6px 14px;font-size:12px;color:#667085}
.bi{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid #e3e8f2;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.bi b{color:#14305f}.bi small{color:#667085;font-size:12px}.card.dlg{max-width:640px;margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14305f;color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media print{.seg,.ov,#toast{display:none!important}}

/* ---------- download helper ---------- */
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000)}

/* ---------- minimal XLSX writer (no library needed) ---------- */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){const te=new TextEncoder(),parts=[],cen=[];let off=0;
files.forEach(([name,txt])=>{const nb=te.encode(name),d=te.encode(txt),crc=crc32(d);
const lh=new Uint8Array(30+nb.length),v=new DataView(lh.buffer);
v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);v.setUint16(10,0,true);v.setUint16(12,0x21,true);v.setUint32(14,crc,true);v.setUint32(18,d.length,true);v.setUint32(22,d.length,true);v.setUint16(26,nb.length,true);v.setUint16(28,0,true);lh.set(nb,30);
parts.push(lh,d);
const ch=new Uint8Array(46+nb.length),c=new DataView(ch.buffer);
c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);ch.set(nb,46);
cen.push(ch);off+=lh.length+d.length});
let cs=0;cen.forEach(c=>cs+=c.length);
const e=new Uint8Array(22),ev=new DataView(e.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,cs,true);ev.setUint32(16,off,true);
return new Blob([...parts,...cen,e],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
const xe=t=>String(t==null?"":t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const colL=n=>{let s="";n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
const HFILL=[0,3,4,5,6];/* fill index per highlight: none,yellow,green,blue,pink */
function mkStyles(){const xfs=[],map={};
const X=(font,fill,border,h,wrap)=>{const k=[font,fill,border,h,wrap].join("|");if(!(k in map)){map[k]=xfs.length;xfs.push([font,fill,border,h,wrap])}return map[k]};
X(0,0,0,"",0);
const get=key=>{const m=/^([A-Za-z]+)(\d?)$/.exec(key),t=m[1],h=+m[2]||0;
switch(t){case"title":return X(2,0,1,"center",0);case"head":return X(1,0,1,"center",0);case"grp":return X(1,2,1,"center",0);case"totL":return X(1,0,1,"left",0);case"totC":return X(1,0,1,"center",0);case"words":return X(2,0,1,"center",0);
case"L":return X(0,HFILL[h],1,"left",0);case"C":return X(0,HFILL[h],1,"center",0);case"R":return X(3,HFILL[h],1,"center",0)}return 0};
const xml=()=>{const fills=["none","gray125","D9E2F3","FFF2A8","C6EFCE","BDD7EE","F8CBD6"].map((c,i)=>i<2?`<fill><patternFill patternType="${c}"/></fill>`:`<fill><patternFill patternType="solid"><fgColor rgb="FF${c}"/><bgColor indexed="64"/></patternFill></fill>`).join("");
const F=(b,sz,col)=>`<font>${b?"<b/>":""}<sz val="${sz}"/>${col?`<color rgb="${col}"/>`:""}<name val="Times New Roman"/><family val="1"/></font>`;
const side=`<left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/>`;
return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="4">${F(0,11)}${F(1,11)}${F(1,12)}${F(1,11,"FFC00000")}</fonts><fills count="7">${fills}</fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border>${side}</border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.map(([f,fi,b,h,w])=>`<xf numFmtId="0" fontId="${f}" fillId="${fi}" borderId="${b}" xfId="0" applyFont="1" applyFill="1" applyBorder="1"${h||w?` applyAlignment="1"><alignment${h?` horizontal="${h}"`:""} vertical="center"${w?' wrapText="1"':""}/></xf>`:"/>"}`).join("")}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`};
return{get,xml}}
function mkSheet(N,idx){const tl=S.bill=="ALL"?"TAX":S.bill=="GOB"?"INCOME TAX":S.bill=="TRE-01"?"S.TAX":"S TAX";
const labs=labels(tl,N),nc=labs.length,R=[],mg=[],skip=new Set(),Tt={bs:0,da:0,hra:0,ma:0,gpf:0,gli:0,tax:0,g:0,td:0,n:0,cut:0};
const fill=(arr,k,key)=>{while(arr.length<k)arr.push({v:"",s:key})};
const cat=(N?S.neg:"CATEGORY:-"+(S.bill=="ALL"?"ALL BILLS":S.bill))+(N&&S.bill!="ALL"?" | "+S.bill:"")+(S.hf!==""?" | HRA "+hl(S.hf):"")+(S.school?" | "+S.school:"");
[S.ddo,S.office,cat,"MONTH:-"+MONTHS[S.m]+" "+S.y].forEach(t=>{const r=[{v:t,s:"title"}];fill(r,nc,"title");skip.add(R.length);mg.push([R.length,0,R.length,nc-1]);R.push(r)});
R.push(labs.map(l=>({v:l,s:"head"})));
let lastB="";
idx.forEach((i,j)=>{const r=D[i],c=calc(i),hi=S.hi[i]||0;for(const k in Tt)Tt[k]+=c[k];
if(S.bill=="ALL"&&r[0]!=lastB){lastB=r[0];const g=[{v:r[0],s:"grp"}];fill(g,nc,"grp");skip.add(R.length);mg.push([R.length,0,R.length,nc-1]);R.push(g)}
const row=[{v:j+1,s:"C"+hi},{v:r[1],s:"L"+hi},{v:r[2],s:"L"+hi},{v:r[3],s:"C"+hi}];
if(c.txt){const bc=r[12]=="b";const from=row.length,ot=S.ov[i]&&S.ov[i].txt!=null?S.ov[i].txt:null;row.push({v:ot!=null?ot:(bc||c.b==null?r[10]:"BASIC "+c.b+" | "+r[10]),s:"R"+hi});fill(row,nc,"R"+hi);mg.push([R.length,from,R.length,nc-1]);R.push(row);return}
[c.bs,c.da,c.hra,c.ma,c.gpf,c.gli,c.tax,c.g,c.td,c.n].forEach(v=>row.push({v,s:"C"+hi}));

R.push(row);
if(r[12]=="n"){const q=[{v:"",s:"C0"},{v:"",s:"C0"},{v:"",s:"C0"},{v:"",s:"C0"},{v:r[10],s:"R0"}];fill(q,nc,"R0");mg.push([R.length,4,R.length,nc-1]);R.push(q)}});
const tot=[{v:"",s:"totC"},{v:"TOTAL",s:"totL"},{v:"",s:"totC"},{v:"",s:"totC"}];[Tt.bs,Tt.da,Tt.hra,Tt.ma,Tt.gpf,Tt.gli,Tt.tax,Tt.g,Tt.td,Tt.n].forEach(v=>tot.push({v,s:"totC"}));if(!N){R.push(tot);
const wr=[{v:words(Tt.g),s:"words"}];fill(wr,nc,"words");skip.add(R.length);mg.push([R.length,0,R.length,nc-1]);R.push(wr)}
const wd=Array(nc).fill(6);R.forEach((row,ri)=>{if(skip.has(ri))return;row.forEach((c,ci)=>{if(ci>=nc)return;const t=String(c.v==null?"":c.v),num=typeof c.v=="number";if(mg.some(m=>m[0]==ri&&ci>=m[1]&&m[1]>0&&m[1]<=ci))return;wd[ci]=Math.max(wd[ci],t.length*(num?1.1:1.25)+3)})});
return{R,mg,wd:wd.map(x=>Math.min(60,Math.round(x*10)/10)),nc,head:5}}
function sheetXml(m,ST){const rows=m.R.map((r,ri)=>`<row r="${ri+1}"${ri==4?' ht="20" customHeight="1"':(ri>4&&S.rh?` ht="${15+S.rh*1.5}" customHeight="1"`:"")}>${r.map((c,ci)=>{const ref=colL(ci)+(ri+1),s=ST.get(c.s);
if(typeof c.v=="number")return`<c r="${ref}" s="${s}"><v>${c.v}</v></c>`;
if(c.v===""||c.v==null)return`<c r="${ref}" s="${s}"/>`;
return`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xe(c.v)}</t></is></c>`}).join("")}</row>`).join("");
return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="${m.head}" topLeftCell="A${m.head+1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${m.wd.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${rows}</sheetData><mergeCells count="${m.mg.length}">${m.mg.map(g=>`<mergeCell ref="${colL(g[1])}${g[0]+1}:${colL(g[3])}${g[2]+1}"/>`).join("")}</mergeCells><pageMargins left="0.3" right="0.3" top="0.4" bottom="0.4" header="0.2" footer="0.2"/><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`}
function exportXlsx(){
const all=pick(),neg=all.filter(isNeg),N=S.view=="neg";
const list=N?[["Negative",mkSheet(true,neg)],["Bill",mkSheet(false,all)]]:[["Bill",mkSheet(false,all)],["Negative",mkSheet(true,neg)]];
const ST=mkStyles(),sx=list.map(([nm,m])=>sheetXml(m,ST));
const files=[["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${list.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${list.map(([nm],i)=>`<sheet name="${nm}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets><definedNames>${list.map(([nm,m],i)=>`<definedName name="_xlnm.Print_Titles" localSheetId="${i}">${nm}!$1:$${m.head}</definedName>`).join("")}</definedNames></workbook>`],
["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${list.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${list.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
["xl/styles.xml",ST.xml()],
...sx.map((x,i)=>[`xl/worksheets/sheet${i+1}.xml`,x])];
dl(zip(files),"Kurtha_Bill_"+MONTHS[S.m]+"_"+S.y+(S.bill=="ALL"?"_ALL":"_"+S.bill.replace(/[^A-Za-z0-9]+/g,"_"))+".xlsx");toast("Excel downloaded")}

$("at_bill").innerHTML=BILLS.map(b=>`<option>${esc(b)}</option>`).join("");$("at_bill").value=S.bill!="ALL"?S.bill:BILLS[0];
const sch=[...new Set(D.filter((r,i)=>!S.rm[i]).map(r=>r[2]))].sort();
$("at_sch").innerHTML=sch.map(x=>`<option>${esc(x)}</option>`).join("")+`<option value="__new">＋ New school…</option>`;if(S.school&&sch.includes(S.school))$("at_sch").value=S.school;syncSS("at_sch");

$("at_hra").innerHTML=`<option value="0">${S.hn}% (normal)</option><option value="1">${S.hs}% (special)</option><option value="2">Nil</option>`;

function saveAdd(){const nm=$("at_name").value.trim().toUpperCase(),b=$("at_bill").value;let sc=$("at_sch").value;if(sc=="__new")sc=$("at_sch2").value.trim().toUpperCase();
const bs=$("at_basic").value;if(!nm){toast("Enter teacher name");$("at_name").focus();return}if(!sc){toast("Enter school name");return}if(bs===""||+bs<=0){toast("Enter Basic Pay");$("at_basic").focus();return}
const num=k=>$(k).value===""?null:+$(k).value;
const row=[b,nm,sc,$("at_id").value.trim(),+bs,+$("at_hra").value,num("at_ma"),num("at_gpf"),num("at_gli")==null?30:num("at_gli"),num("at_tax"),"",0,""];
S.add.push(row);applyAdd();S.bill=b;S.hf="";S.q="";if($("fq"))$("fq").value="";S.school=sc;S.teacher="";S.view="bill";fillF();$("ov").hidden=true;go();toast("Teacher added: "+nm);

function syncSS(id){const s=$(id),b=SS[id];if(!b)return;const o=s.options[s.selectedIndex];b.textContent=o?o.text:""}
function makeSS(id){const sel=$(id);sel.style.display="none";const b=document.createElement("button");b.type="button";b.className="ssb";sel.parentNode.insertBefore(b,sel.nextSibling);SS[id]=b;b.onclick=()=>openSS(id);syncSS(id)}
let ssCur=null;
function renderSS(q){const sel=$(ssCur),w=q.toLowerCase().split(/\s+/).filter(Boolean);let h="",n=0;
[...sel.options].forEach((o,i)=>{if(o.value=="__new"&&q)return;const t=o.text.toLowerCase();if(w.every(x=>t.includes(x))){n++;h+=`<div class="spi${i==sel.selectedIndex?" on":""}" data-i="${i}">${esc(o.text)}</div>`}});
$("splist").innerHTML=h||`<div class="spc" style="padding:16px">No match found.</div>`;$("spc").textContent=n+" found"}

$("spq").addEventListener("input",e=>renderSS(e.target.value));

return`<div class="bi"><div><b>${esc(r[1])}</b><br><small>${esc(r[2])} · ${esc(r[0])}${r[3]?" · "+esc(r[3]):""}${r[4]!=null?" · Basic ₹"+r[4]:""}${t?"<br>Deleted: "+t:""}</small></div><button data-rs="${i}">↩ Restore</button></div>`}).join(""):`<div class="hint" style="padding:12px 0;text-align:center">No deleted teachers.</div>`;
$("binall").disabled=!ids.length}

document.addEventListener("click",e=>{const b=e.target.closest("[data-rs]");if(!b)return;const i=+b.dataset.rs,r=D[i];delete S.rm[i];fillF();go();toast("Restored: "+r[1]+" ("+r[0]+" – "+r[2]+")")});
